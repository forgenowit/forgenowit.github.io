<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Interactive map of ForgeNow graduate talent across the United States.">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F4F1EB">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>ForgeNow — Graduate Talent Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=DM+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#F4F1EB;--surface:#FFF;--ink:#1A1A18;--ink-muted:#6B6861;--ink-faint:#B5B2A9;
            --border:#E0DDD6;
            --hvac:#C8390A;--hvac-bg:#FDF0EC;
            --elec:#0B6E5A;--elec-bg:#E5F4F1;
            --plumb:#1D5FA8;--plumb-bg:#E8F0FB;
            --fac:#7A4D0F;--fac-bg:#F7EFE2;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
        .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

        /* HEADER — logo + filters only */
        .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;min-height:58px;display:flex;align-items:center;gap:20px;flex-shrink:0;z-index:10}
        .logo{height:30px;width:auto}
        .hdr-sep{width:1px;height:22px;background:var(--border)}
        .hdr-sub{font-size:12.5px;color:var(--ink-muted)}
        .filters{display:flex;gap:6px;margin-left:auto}
        .chip{min-height:36px;padding:7px 13px;border-radius:99px;border:1px solid var(--border);font:500 12px 'DM Sans',sans-serif;color:var(--ink-muted);cursor:pointer;transition:all .15s;background:transparent;white-space:nowrap}
        .chip:hover{border-color:var(--ink);color:var(--ink)}
        .chip.on-all{background:var(--ink);color:#fff;border-color:var(--ink)}
        .chip.on-HVAC{background:var(--hvac);color:#fff;border-color:var(--hvac)}
        .chip.on-ELECTRICAL{background:var(--elec);color:#fff;border-color:var(--elec)}
        .chip.on-PLUMBING{background:var(--plumb);color:#fff;border-color:var(--plumb)}
        .chip.on-FACILITIES{background:var(--fac);color:#fff;border-color:var(--fac)}

        /* MAP — full width */
        .map-wrap{flex:1;position:relative;overflow:hidden}
        #map-svg{width:100%;height:100%;display:block;outline:none;touch-action:none}
        #map-svg:focus-visible{outline:3px solid var(--plumb);outline-offset:-3px}
        .state-path{fill:#EBE7DF;stroke:#D8D4CC;stroke-width:.7}
        .marker{cursor:pointer;transition:opacity .12s}
        .marker:hover,.marker:focus{opacity:1}
        .marker .active-ring{display:none;fill:none;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
        .marker.active .active-ring{display:block}

        /* TOOLTIP */
        .tt{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:160px;max-width:220px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:300}
        .tt.show{opacity:1;transform:translateY(0)}
        .tt-loc{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:6px;line-height:1.2}
        .tt-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
        .b-HVAC{background:var(--hvac-bg);color:var(--hvac)}
        .b-ELECTRICAL{background:var(--elec-bg);color:var(--elec)}
        .b-PLUMBING{background:var(--plumb-bg);color:var(--plumb)}
        .b-FACILITIES{background:var(--fac-bg);color:var(--fac)}

        /* LEGEND */
        .legend{position:absolute;bottom:18px;right:18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 15px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
        .leg-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted);margin-bottom:8px}
        .leg-r{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px;color:var(--ink-muted)}
        .leg-r:last-child{margin-bottom:0}
        .leg-d{width:10px;height:10px;border-radius:50%;flex-shrink:0}

        /* ZOOM */
        .ctrls{position:absolute;bottom:18px;left:18px;display:flex;flex-direction:column;gap:4px}
        .cb{width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);box-shadow:0 2px 8px rgba(0,0,0,.07);transition:all .15s;font-family:monospace}
        .cb:hover,.cb:focus-visible{background:var(--ink);color:#fff;border-color:var(--ink);outline:none}
        @media(max-width:700px){
            .hdr{padding:8px 12px 0;display:grid;grid-template-columns:auto 1px 1fr;grid-template-rows:34px 56px;gap:0 12px}
            .hdr-sep{height:20px}.hdr-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            .filters{grid-column:1/-1;width:calc(100% + 24px);margin-left:-12px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
            .filters::-webkit-scrollbar{display:none}.chip{min-height:44px}.legend{bottom:12px;right:12px}.ctrls{bottom:12px;left:12px}
            .cb{width:44px;height:44px}
        }
        @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.chip,.cb,.tt,.marker{transition:none!important}}
    </style>
</head>

    const HEX={HVAC:'#C8390A',ELECTRICAL:'#0B6E5A',PLUMBING:'#1D5FA8',FACILITIES:'#7A4D0F'};
    const LBL={HVAC:'HVAC',ELECTRICAL:'Electrical',PLUMBING:'Plumbing',FACILITIES:'Facilities'};
    let DATA=[],aF='all',svgEl,proj,zB,usData,currentTransform,rendered=[],activeRecordIndex=null,tooltipPinned=false,resizeTimer,resizeObserver,initStarted=false;

    function announceStatus(message){
        const status=document.getElementById('map-status');
        status.textContent='';
        requestAnimationFrame(()=>{status.textContent=message;});
    }

    function prepareData(){
        DATA=DOTS.filter(d=>HEX[d.trade]&&Number.isFinite(d.latitude)&&Number.isFinite(d.longitude))
            .map((d,index)=>({...d,index}));
    }

    function filt(){return DATA.filter(s=>aF==='all'||s.trade===aF);}

    function setFilter(f,el){
        aF=f; tooltipPinned=false; hideTooltip(true);
        document.querySelectorAll('.chip').forEach(c=>{
            c.className='chip'; c.setAttribute('aria-pressed',String(c===el));
        });
        el.classList.add(f==='all'?'on-all':'on-'+f);
        renderDots();
    }

    function renderDots(){
        if(!svgEl||!proj)return;
        const g=svgEl.select('#dots-g'); g.selectAll('*').remove();
        rendered=filt().map(point=>{
            const xy=proj([point.longitude,point.latitude]);
            return xy?{point,x:xy[0],y:xy[1]}:null;
        }).filter(Boolean);
        rendered.forEach((item,i)=>{
            const p=item.point;
            const node=g.append('g').attr('class','marker').classed('active',p.index===activeRecordIndex)
                .attr('aria-hidden','true').attr('data-record-index',p.index)
                .attr('transform',`translate(${item.x},${item.y})`).attr('opacity',.9);
            node.append('circle').attr('class','active-ring').attr('r',9);
            node.append('circle').attr('r',5).attr('fill',HEX[p.trade])
                .attr('stroke','#fff').attr('stroke-width',1.5);
            node.on('pointermove',ev=>showTooltip(p,ev.clientX,ev.clientY))
                .on('pointerleave',ev=>{if(ev.pointerType!=='touch')hideTooltip();})
                .on('click',ev=>{ev.stopPropagation();tooltipPinned=true;setActive(item,true);});
        });
        reconcileSelection(false);
    }

    function showTooltip(point,clientX,clientY){
        const tt=document.getElementById('tt'),wrap=document.getElementById('map-wrap'),r=wrap.getBoundingClientRect();
        tt.replaceChildren();
        const loc=document.createElement('div');loc.className='tt-loc';loc.textContent=point.location;tt.appendChild(loc);
        const tag=document.createElement('span');tag.className=`tt-badge b-${point.trade}`;tag.textContent=LBL[point.trade];tt.appendChild(tag);
        let tx=clientX-r.left+14,ty=clientY-r.top-14;
        if(tx+230>r.width)tx=Math.max(8,tx-244);if(ty+100>r.height)ty=Math.max(8,ty-90);
        tt.style.left=`${tx}px`;tt.style.top=`${ty}px`;tt.classList.add('show');
    }

    function hideTooltip(force=false){
        if(tooltipPinned&&!force)return;
        document.getElementById('tt').classList.remove('show');
    }

    function screenPosition(item){
        return {x:currentTransform.applyX(item.x),y:currentTransform.applyY(item.y)};
    }

    function visibleItems(){
        const wrap=document.getElementById('map-wrap'),W=wrap.clientWidth,H=wrap.clientHeight;
        return rendered.filter(item=>{const p=screenPosition(item);return p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H;});
    }

    function closestToCenter(items){
        const wrap=document.getElementById('map-wrap'),cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;
        return items.reduce((best,item)=>{
            const p=screenPosition(item),score=(p.x-cx)**2+(p.y-cy)**2;
            return !best||score<best.score?{item,score}:best;
        },null)?.item||null;
    }

    function setActive(item,announce=false){
        if(!item)return;
        activeRecordIndex=item.point.index;
        const g=svgEl.select('#dots-g');
        g.selectAll('.marker').classed('active',false);
        const selected=g.select(`[data-record-index="${activeRecordIndex}"]`).classed('active',true);
        selected.raise();
        if(announce){
            const r=document.getElementById('map-wrap').getBoundingClientRect(),p=screenPosition(item);
            showTooltip(item.point,r.left+p.x,r.top+p.y);
            announceStatus(`${item.point.location}, ${LBL[item.point.trade]}`);
        }
    }

    function clearActive(){
        activeRecordIndex=null;
        if(svgEl)svgEl.select('#dots-g').selectAll('.marker').classed('active',false);
    }

    function reconcileSelection(announce=false){
        const visible=visibleItems();
        if(!visible.length){clearActive();return;}
        const current=visible.find(item=>item.point.index===activeRecordIndex);
        if(current)setActive(current,announce);
        else clearActive();
    }

    function showMapError(message){
        announceStatus(message);
        if(!svgEl)return;
        svgEl.selectAll('.map-error').remove();
        const wrap=document.getElementById('map-wrap');
        svgEl.append('text').attr('class','map-error').attr('x',(wrap.clientWidth||960)/2)
            .attr('y',(wrap.clientHeight||580)/2).attr('text-anchor','middle')
            .attr('fill','#9f2d08').attr('font-size','14').text(message);
    }

    function handleMapKeys(event){
        if(event.key==='Escape'){
            tooltipPinned=false;hideTooltip(true);return;
        }
        const arrows=['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'];
        const isArrow=arrows.includes(event.key);
        const isActivation=event.key==='Enter'||event.key===' ';
        if(!isArrow&&!isActivation)return;
        const visible=visibleItems();if(!visible.length)return;
        let current=visible.find(item=>item.point.index===activeRecordIndex);
        if(!current){
            current=closestToCenter(visible);
            if(isArrow){event.preventDefault();setActive(current,true);return;}
        }
        if(isArrow){
            event.preventDefault();
            const origin=screenPosition(current),horizontal=event.key==='ArrowRight'||event.key==='ArrowLeft';
            const positive=event.key==='ArrowRight'||event.key==='ArrowDown';
            const candidates=visible.filter(item=>item!==current).map(item=>{
                const p=screenPosition(item),dx=p.x-origin.x,dy=p.y-origin.y;
                const primary=horizontal?dx:dy,perpendicular=Math.abs(horizontal?dy:dx);
                if(positive?primary<=1:primary>=-1)return null;
                return {item,score:Math.abs(primary)+perpendicular*2.5};
            }).filter(Boolean).sort((a,b)=>a.score-b.score);
            if(candidates.length)setActive(candidates[0].item,true);
        }else if(event.key==='Enter'||event.key===' '){
            event.preventDefault();tooltipPinned=true;setActive(current,true);
        }
    }

    function zIn(){svgEl.transition().call(zB.scaleBy,1.45);}
    function zOut(){svgEl.transition().call(zB.scaleBy,.70);}
    function zReset(){svgEl.transition().duration(450).call(zB.transform,d3.zoomIdentity);}

    function layout(){
        const wrap=document.getElementById('map-wrap'),W=wrap.clientWidth||960,H=wrap.clientHeight||580;
        proj=d3.geoAlbersUsa();
        if(usData)proj.fitExtent([[24,24],[W-24,H-24]],{type:'FeatureCollection',features:usData});
        else proj.scale(1150*Math.min(W/960,H/580)).translate([W/2,H/2]);
        svgEl.attr('viewBox',`0 0 ${W} ${H}`);
        if(usData)svgEl.select('#states-g').selectAll('path').attr('d',d3.geoPath().projection(proj));
        renderDots();
    }

    async function init(){
        if(initStarted)return;
        initStarted=true;
        if(typeof d3==='undefined'||typeof topojson==='undefined'){
            const error=document.createElementNS('http://www.w3.org/2000/svg','text');
            error.setAttribute('x','50%');error.setAttribute('y','50%');error.setAttribute('text-anchor','middle');
            error.setAttribute('fill','#9f2d08');error.setAttribute('font-size','14');error.setAttribute('role','alert');
            error.textContent='Map unavailable — required scripts did not load';
            document.getElementById('map-svg').appendChild(error);
            announceStatus(error.textContent);return;
        }
        prepareData();svgEl=d3.select('#map-svg');currentTransform=d3.zoomIdentity;
        const sg=svgEl.append('g').attr('id','states-g');svgEl.append('g').attr('id','dots-g');
        zB=d3.zoom().scaleExtent([.7,10]).on('zoom',e=>{
            currentTransform=e.transform;sg.attr('transform',e.transform);svgEl.select('#dots-g').attr('transform',e.transform);
            tooltipPinned=false;hideTooltip(true);
        }).on('end',()=>reconcileSelection(false));
        svgEl.call(zB).on('dblclick.zoom',null);
        const mapNode=document.getElementById('map-svg');
        mapNode.addEventListener('keydown',handleMapKeys);
        document.getElementById('map-wrap').addEventListener('click',()=>{tooltipPinned=false;hideTooltip(true);});
        const scheduleLayout=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(layout,120);};
        if('ResizeObserver' in window){
            resizeObserver=new ResizeObserver(scheduleLayout);
            resizeObserver.observe(document.getElementById('map-wrap'));
        }else window.addEventListener('resize',scheduleLayout);
        layout();
        try{
            const us=await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');
            usData=topojson.feature(us,us.objects.states).features;
            sg.selectAll('path').data(usData).enter().append('path').attr('class','state-path');
            layout();
            announceStatus('Map loaded. Focus the map and use the arrow keys to explore visible markers.');
        }catch(e){showMapError('Map outline unavailable — check your connection');}
    }
